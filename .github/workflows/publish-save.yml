name: Publish reviewed save
on:
  pull_request_target:
    types: [closed]
    paths: ['submissions/*.json']
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request number
        required: true
        type: number
      pr_head_sha:
        description: Exact independently approved head SHA
        required: true
        type: string
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: save-repository-publication
  # Keep every explicit request queued while serializing shared catalog writes.
  queue: max
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scanner and signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Revalidate and publish approved fixed version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha }}
          AE_SAVE_MODE: publish
          AE_SAVE_AUTO_REVIEW: ${{ vars.AE_SAVE_AUTO_REVIEW }}
        run: node lib/save-workflow.mjs
